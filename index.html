<!doctype html>
<html lang="zh-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>AI Mandarin Partner — AI Zhōngwén Hǎo Péngyou</title>
    <meta
      name="description"
      content="TOCFL Band A level daily conversation with AI for Mandarin learners to practice speaking and listening skills daily."
    />
    <meta
      property="og:title"
      content="AI Mandarin Partner — AI Zhōngwén Hǎo Péngyou"
    />
    <meta
      property="og:description"
      content="TOCFL Band A level daily conversation with AI for Mandarin learners to practice speaking and listening skills daily."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F5F7F8" />
    <style>
      :root {
        --bg-canvas: #f5f7f8;
        --bg-surface: #ffffff;
        --bg-header: rgba(255, 255, 255, 0.86);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --border-subtle: rgba(226, 232, 240, 0.85);
        --border-card: #e2e8f0;
        --teal: #0f766e;
        --teal-hover: #0d9488;
        --rose: #be123c;
        --rose-hover: #9f1239;
        --slate-btn: #1e293b;
        --slate-btn-hover: #334155;
        --amber-bg: #fffbeb;
        --amber-border: #fcd34d;
        --amber-text: #78350f;
        --amber-icon: #b45309;
        --blue-icon: #1d4ed8;
        --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
          Monaco, Consolas, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
      }

      ::selection {
        background-color: #ccfbf1;
        color: #134e4a;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
      }

      .app-shell {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
      }

      /* Top Navigation Bar */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 56px;
        border-bottom: 1px solid var(--border-subtle);
        background-color: var(--bg-header);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .topbar-inner {
        margin: 0 auto;
        display: flex;
        height: 100%;
        max-width: 1024px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 16px;
      }

      @media (min-width: 640px) {
        .topbar-inner {
          padding: 0 24px;
        }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-logo {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        color: var(--teal);
      }

      .brand-name {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .transcript-btn {
        display: inline-flex;
        min-height: 44px;
        flex-shrink: 0;
        align-items: center;
        gap: 8px;
        border-radius: 12px;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 500;
        color: #334155;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .transcript-btn:hover {
        background-color: #f1f5f9;
        color: var(--text-primary);
      }

      .transcript-btn:focus-visible,
      .icon-btn:focus-visible,
      .drawer-clear-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--teal);
      }

      /* Main Call Stage */
      .stage {
        position: relative;
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      }

      @media (min-width: 640px) {
        .stage {
          padding: 40px 20px;
        }
      }

      .stage-aura {
        pointer-events: none;
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 46%,
          rgba(15, 118, 110, 0.055) 0%,
          transparent 58%
        );
      }

      .stage-content {
        position: relative;
        z-index: 10;
        display: flex;
        width: 100%;
        max-width: 672px;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .stage-title {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--text-primary);
        text-wrap: balance;
      }

      @media (min-width: 640px) {
        .stage-title {
          font-size: 36px;
        }
      }

      /* Voice Visualizer & Central Call Button */
      .visualizer {
        --voice-energy: 0;
        position: relative;
        margin: 36px 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (min-width: 640px) {
        .visualizer {
          margin: 44px 0;
        }
      }

      .ring-outer,
      .ring-inner {
        pointer-events: none;
        position: absolute;
        border-radius: 9999px;
        border: 1px solid rgba(17, 94, 89, 0.1);
        background-color: rgba(15, 118, 110, 0.02);
        transition: transform 140ms ease-out, opacity 150ms ease,
          border-color 150ms ease, background-color 150ms ease;
        transform: scale(1);
        opacity: 0.75;
      }

      .ring-outer {
        width: 192px;
        height: 192px;
      }

      .ring-inner {
        width: 160px;
        height: 160px;
        border-color: rgba(17, 94, 89, 0.15);
        background-color: rgba(15, 118, 110, 0.03);
        opacity: 1;
      }

      @media (min-width: 640px) {
        .ring-outer {
          width: 224px;
          height: 224px;
        }

        .ring-inner {
          width: 192px;
          height: 192px;
        }
      }

      .visualizer[data-live="true"] .ring-outer {
        transform: scale(calc(1 + var(--voice-energy, 0) * 0.24));
        opacity: 0.9;
      }

      .visualizer[data-live="true"] .ring-inner {
        transform: scale(calc(1 + var(--voice-energy, 0) * 0.14));
        opacity: 1;
      }

      .visualizer[data-mode="listening"] .ring-outer,
      .visualizer[data-mode="listening"] .ring-inner {
        border-color: rgba(244, 63, 94, 0.25);
        background-color: rgba(244, 63, 94, 0.05);
      }

      .visualizer[data-mode="speaking"] .ring-outer,
      .visualizer[data-mode="speaking"] .ring-inner {
        border-color: rgba(59, 130, 246, 0.25);
        background-color: rgba(59, 130, 246, 0.05);
      }

      .call-btn {
        position: relative;
        z-index: 10;
        display: flex;
        width: 144px;
        height: 144px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 9999px;
        padding: 0 12px;
        color: #ffffff;
        background-color: var(--teal);
        box-shadow: 0 20px 25px -5px rgba(19, 78, 74, 0.2),
          0 8px 10px -6px rgba(19, 78, 74, 0.15);
        transition: background-color 150ms ease, transform 150ms ease,
          box-shadow 150ms ease;
      }

      @media (min-width: 640px) {
        .call-btn {
          width: 168px;
          height: 168px;
        }
      }

      .call-btn:hover {
        background-color: var(--teal-hover);
      }

      .call-btn:active {
        transform: scale(0.95);
      }

      .call-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.35),
          0 20px 25px -5px rgba(19, 78, 74, 0.2);
      }

      .call-btn[data-call-status="connecting"] {
        background-color: var(--slate-btn);
        box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.18);
      }

      .call-btn[data-call-status="connecting"]:hover {
        background-color: var(--slate-btn-hover);
      }

      .call-btn[data-call-status="listening"],
      .call-btn[data-call-status="speaking"] {
        background-color: var(--rose);
        box-shadow: 0 20px 25px -5px rgba(136, 19, 55, 0.22),
          0 8px 10px -6px rgba(136, 19, 55, 0.16);
      }

      .call-btn[data-call-status="listening"]:hover,
      .call-btn[data-call-status="speaking"]:hover {
        background-color: var(--rose-hover);
      }

      .call-btn[data-call-status="listening"]:focus-visible,
      .call-btn[data-call-status="speaking"]:focus-visible {
        box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.35),
          0 20px 25px -5px rgba(136, 19, 55, 0.22);
      }

      .call-btn-icon {
        width: 42px;
        height: 42px;
      }

      .call-btn-label {
        font-size: 12px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: 0.02em;
        text-align: center;
      }

      @media (min-width: 640px) {
        .call-btn-label {
          font-size: 14px;
        }
      }

      /* Status Indicator */
      .status-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .status-badge-icon {
        display: inline-flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
      }

      .status-badge-listening {
        border: 1px solid #fecdd3;
        background-color: #fff1f2;
        color: var(--rose);
      }

      .status-badge-muted {
        border: 1px solid #fde68a;
        background-color: var(--amber-bg);
        color: var(--amber-icon);
      }

      /* Secondary Controls (Icon-only Mute + Duration) */
      .controls-row {
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .mute-btn {
        display: inline-flex;
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        border: 1px solid var(--border-card);
        background-color: var(--bg-surface);
        color: #334155;
        transition: background-color 150ms ease, border-color 150ms ease,
          color 150ms ease;
      }

      .mute-btn:hover {
        background-color: #f8fafc;
      }

      .mute-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--teal);
      }

      .mute-btn[aria-pressed="true"] {
        border-color: var(--amber-border);
        background-color: var(--amber-bg);
        color: var(--amber-text);
      }

      .mute-btn[aria-pressed="true"]:hover {
        background-color: #fef3c7;
      }

      .timer-box {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        border-radius: 12px;
        border: 1px solid var(--border-card);
        background-color: var(--bg-surface);
        padding: 0 14px;
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 500;
        color: #334155;
        font-variant-numeric: tabular-nums;
      }

      /* Error & Live Subtitle Cards */
      .error-alert {
        margin-top: 24px;
        display: flex;
        width: 100%;
        max-width: 448px;
        align-items: flex-start;
        gap: 12px;
        border-radius: 16px;
        border: 1px solid #fecdd3;
        background-color: #fff1f2;
        padding: 14px 16px;
        text-align: left;
        font-size: 14px;
        line-height: 1.6;
        color: #881337;
      }

      .subtitle-card {
        margin-top: 28px;
        width: 100%;
        max-width: 448px;
        border-radius: 16px;
        border: 1px solid rgba(226, 232, 240, 0.9);
        background-color: var(--bg-surface);
        padding: 16px 20px;
        text-align: left;
        box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      }

      .subtitle-role {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
      }

      .subtitle-text {
        margin: 4px 0 0;
        font-size: 16px;
        line-height: 1.6;
        color: var(--text-primary);
      }

      @media (min-width: 640px) {
        .subtitle-text {
          font-size: 18px;
        }
      }

      /* Transcript Drawer / Bottom Sheet */
      .drawer-root {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        justify-content: flex-end;
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background-color: rgba(15, 23, 42, 0.35);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }

      .drawer-panel {
        position: relative;
        z-index: 10;
        margin-top: auto;
        display: flex;
        max-height: 82dvh;
        width: 100%;
        flex-direction: column;
        border-radius: 24px 24px 0 0;
        border-top: 1px solid var(--border-card);
        background-color: var(--bg-surface);
        box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      @media (min-width: 640px) {
        .drawer-panel {
          margin-top: 0;
          max-height: none;
          max-width: 448px;
          border-radius: 0;
          border-top: none;
          border-left: 1px solid var(--border-card);
          padding-bottom: 0;
        }
      }

      .drawer-handle {
        margin: 12px auto 0;
        height: 6px;
        width: 40px;
        border-radius: 9999px;
        background-color: #cbd5e1;
      }

      @media (min-width: 640px) {
        .drawer-handle {
          display: none;
        }
      }

      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-card);
        padding: 14px 20px;
      }

      .drawer-title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .drawer-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .drawer-clear-btn {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        gap: 6px;
        border-radius: 12px;
        padding: 0 12px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        transition: background-color 150ms ease, color 150ms ease;
      }

      .drawer-clear-btn:hover,
      .icon-btn:hover {
        background-color: #f1f5f9;
        color: var(--text-primary);
      }

      .icon-btn {
        display: inline-flex;
        min-width: 44px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        color: var(--text-secondary);
        transition: background-color 150ms ease, color 150ms ease;
      }

      .drawer-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .drawer-empty {
        display: flex;
        height: 192px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .drawer-empty p {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #334155;
      }

      .msg-row {
        display: flex;
        flex-direction: column;
      }

      .msg-row-tutor {
        align-items: flex-start;
      }

      .msg-row-student {
        align-items: flex-end;
      }

      .msg-role {
        margin-bottom: 4px;
        padding: 0 4px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
      }

      .msg-bubble {
        max-width: 85%;
        border-radius: 16px;
        padding: 10px 16px;
        font-size: 14px;
        line-height: 1.6;
      }

      .msg-bubble-tutor {
        border: 1px solid var(--border-card);
        background-color: #f8fafc;
        color: var(--text-primary);
      }

      .msg-bubble-student {
        background-color: var(--teal);
        color: #ffffff;
      }

      .hidden {
        display: none !important;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .spin {
        animation: spin 1s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .ring-outer,
        .ring-inner {
          transition: none !important;
          transform: scale(1) !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">
            <svg
              aria-hidden="true"
              viewBox="0 0 28 28"
              class="brand-logo"
              fill="none"
            >
              <rect
                x="2"
                y="2"
                width="24"
                height="24"
                rx="7"
                fill="currentColor"
                fill-opacity="0.12"
              />
              <path
                d="M9 14V14.01M14 9.5V18.5M19 12V16"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
            <span class="brand-name">AI Mandarin Partner</span>
          </div>

          <button
            type="button"
            id="open-transcripts-btn"
            class="transcript-btn"
            aria-label="Kāiqǐ duìhuà jìlù"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#64748b"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              />
              <path d="M13 8H7" />
              <path d="M17 12H7" />
            </svg>
            <span id="transcript-btn-label">Duìhuà jìlù</span>
          </button>
        </div>
      </header>

      <!-- Main Voice Call Stage -->
      <main class="stage">
        <div aria-hidden="true" class="stage-aura"></div>
        <div class="stage-content">
          <h1 class="stage-title">AI Zhōngwén Hǎo Péngyou</h1>

          <div
            id="visualizer"
            class="visualizer"
            data-live="false"
            data-mode="idle"
          >
            <div aria-hidden="true" class="ring-outer"></div>
            <div aria-hidden="true" class="ring-inner"></div>

            <button
              type="button"
              id="call-toggle-btn"
              class="call-btn"
              data-testid="call-toggle-button"
              data-call-status="idle"
              aria-label="Kāishǐ tōnghuà"
            >
              <span id="call-btn-icon" aria-hidden="true"></span>
              <span id="call-btn-label" class="call-btn-label"
                >Kāishǐ tōnghuà</span
              >
            </button>
          </div>

          <!-- Status Indicator (omitted on idle; icon-only on listening) -->
          <div
            id="status-indicator"
            role="status"
            aria-live="polite"
            data-testid="call-status-label"
            class="status-row hidden"
          ></div>

          <!-- Secondary Active Call Controls (Icon-only Mute + Duration Timer) -->
          <div id="active-controls" class="controls-row hidden">
            <button
              type="button"
              id="mute-toggle-btn"
              class="mute-btn"
              data-testid="mute-toggle-button"
              aria-pressed="false"
              aria-label="Màikèfēng jìngyīn"
              title="Màikèfēng jìngyīn"
            ></button>
            <span
              id="call-timer"
              aria-label="Tōnghuà shíjiān"
              class="timer-box"
              >00:00</span
            >
          </div>

          <!-- Error Alert -->
          <div id="error-alert" role="alert" class="error-alert hidden">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#be123c"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-top: 2px; flex-shrink: 0"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="12" x2="12" y1="8" y2="12" />
              <line x1="12" x2="12.01" y1="16" y2="16" />
            </svg>
            <span id="error-text"></span>
          </div>

          <!-- Live Subtitle Card -->
          <div id="subtitle-card" class="subtitle-card hidden">
            <div id="subtitle-role" class="subtitle-role"></div>
            <p id="subtitle-text" class="subtitle-text"></p>
          </div>
        </div>
      </main>

      <!-- Transcript Drawer / Mobile Bottom Sheet -->
      <div id="drawer-root" class="drawer-root hidden">
        <button
          type="button"
          id="drawer-backdrop"
          aria-label="Guānbì duìhuà jìlù zhēzhào"
          class="drawer-backdrop"
        ></button>

        <section
          role="dialog"
          aria-modal="true"
          aria-label="Duìhuà jìlù"
          class="drawer-panel"
        >
          <div aria-hidden="true" class="drawer-handle"></div>

          <div class="drawer-header">
            <h2 class="drawer-title">Duìhuà jìlù</h2>
            <div class="drawer-actions">
              <button
                type="button"
                id="drawer-clear-btn"
                aria-label="Qīngchú duìhuà jìlù"
                class="drawer-clear-btn hidden"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 6h18" />
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />

              <button
                type="button"

          <div id="drawer-body" class="drawer-body"></div>
        </section>

    </div>

    <script>
      (() => {
        "use strict";

        const TARGET_INPUT_SAMPLE_RATE = 16000;
        const MODEL_OUTPUT_SAMPLE_RATE = 24000;

        // Inline SVG templates for consistent Lucide-style icons
        const ICONS = {
          micLarge:
            '<svg class="call-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
          phoneOffLarge:
            '<svg class="call-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="22" x2="2" y1="2" y2="22"/></svg>',
          loaderLarge:
            '<svg class="call-btn-icon spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
          loaderSmall:
            '<svg width="16" height="16" class="spin" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
          earSmall:
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"/><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"/></svg>',
          audioLinesSmall:
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>',
          alertSmall:
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
          mic:
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
          micOff:
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
          micOffSmall:
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
        };

        // DOM references
        const openTranscriptsBtn = document.getElementById(
          "open-transcripts-btn"
        );
        const transcriptBtnLabel = document.getElementById(
          "transcript-btn-label"
        );
        const visualizerEl = document.getElementById("visualizer");
        const callToggleBtn = document.getElementById("call-toggle-btn");
        const callBtnIcon = document.getElementById("call-btn-icon");
        const callBtnLabel = document.getElementById("call-btn-label");
        const statusIndicatorEl = document.getElementById("status-indicator");
        const activeControlsEl = document.getElementById("active-controls");
        const muteToggleBtn = document.getElementById("mute-toggle-btn");
        const callTimerEl = document.getElementById("call-timer");
        const errorAlertEl = document.getElementById("error-alert");
        const errorTextEl = document.getElementById("error-text");
        const subtitleCardEl = document.getElementById("subtitle-card");
        const subtitleRoleEl = document.getElementById("subtitle-role");
        const subtitleTextEl = document.getElementById("subtitle-text");
        const drawerRootEl = document.getElementById("drawer-root");
        const drawerBackdropEl = document.getElementById("drawer-backdrop");
        const drawerClearBtn = document.getElementById("drawer-clear-btn");
        const drawerCloseBtn = document.getElementById("drawer-close-btn");
        const drawerBodyEl = document.getElementById("drawer-body");

        // Application State
        let status = "idle"; // "idle" | "connecting" | "listening" | "speaking" | "error"
        let isMuted = false;
        let errorMessage = null;
        let durationSeconds = 0;
        let durationTimerId = null;
        let isDrawerOpen = false;
        let transcripts = [];

        // Audio / WebSocket Refs
        let ws = null;
        let inputCtx = null;
        let outputCtx = null;
        let micStream = null;
        let processorNode = null;
        let sourceNode = null;
        let muteGainNode = null;
        let analyserNode = null;
        let rafId = null;
        let activePlaybackSources = new Set();
        let nextStartTime = 0;

        // Audio DSP Utilities
        function downsampleBuffer(buffer, inputSampleRate, outputSampleRate) {
          if (
            outputSampleRate >= inputSampleRate ||
            buffer.length === 0 ||
            inputSampleRate <= 0
          ) {
            return buffer;
          }
          const ratio = inputSampleRate / outputSampleRate;
          const newLength = Math.floor(buffer.length / ratio);
          const result = new Float32Array(newLength);
          for (let i = 0; i < newLength; i++) {
            const srcPos = i * ratio;
            const low = Math.floor(srcPos);
            const high = Math.min(low + 1, buffer.length - 1);
            const frac = srcPos - low;
            result[i] = buffer[low] * (1 - frac) + buffer[high] * frac;
          }
          return result;
        }

        function float32ToInt16Pcm(float32) {
          const int16 = new Int16Array(float32.length);
          for (let i = 0; i < float32.length; i++) {
            const clamped = Math.max(-1, Math.min(1, float32[i]));
            int16[i] =
              clamped < 0
                ? Math.round(clamped * 0x8000)
                : Math.round(clamped * 0x7fff);
          }
          return int16;
        }

        function int16PcmToBase64(int16) {
          const bytes = new Uint8Array(
            int16.buffer,
            int16.byteOffset,
            int16.byteLength
          );
          let binary = "";
          const chunkSize = 0x8000;
          for (let i = 0; i < bytes.length; i += chunkSize) {
            const slice = bytes.subarray(i, i + chunkSize);
            binary += String.fromCharCode(...slice);
          }
          return btoa(binary);
        }

        function base64ToInt16Pcm(base64) {
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new Int16Array(
            bytes.buffer,
            bytes.byteOffset,
            Math.floor(bytes.byteLength / 2)
          );
        }

        function int16PcmToFloat32(int16) {
          const float32 = new Float32Array(int16.length);
          for (let i = 0; i < int16.length; i++) {
            float32[i] = int16[i] / 0x8000;
          }
          return float32;
        }

        function calculateRmsLevel(samples) {
          if (samples.length === 0) return 0;
          let sum = 0;
          for (let i = 0; i < samples.length; i++) {
            sum += samples[i] * samples[i];
          }
          const rms = Math.sqrt(sum / samples.length);
          return Math.min(1, rms * 6);
        }

        function formatCallDuration(totalSeconds) {
          const safe = Math.max(0, Math.floor(totalSeconds));
          const mins = Math.floor(safe / 60);
          const secs = safe % 60;
          return (
            String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0")
          );
        }

        function mapMicrophoneError(errorName, errorMsg) {
          const name = (errorName || "").toLowerCase();
          const msg = (errorMsg || "").toLowerCase();

          if (
            name === "notallowederror" ||
            name === "permissiondeniederror"
          ) {
            return "Wúfǎ qǔdé màikèfēng quánxiàn. Qǐng zài shǒujī Safari huò Chrome de wǎngzhàn shèdìng zhōng yǔnxǔ shǐyòng màikèfēng.";
          }
          if (name === "notfounderror" || name === "devicesnotfounderror") {
            return "Zhǎobùdào kěyòng de màikèfēng zhuāngzhì, qǐng quèrèn shèbèi shìfǒu yǐ liánjiē màikèfēng.";
          }
          if (name === "notreadableerror" || name === "trackstarterror") {
            return "Màikèfēng mùqián zhèng bèi qítā yìngyòng chéngshì zhànyòng, qǐng guānbì hòu zài shì yīcì.";
          }
          if (
            name === "insecurecontexterror" ||
            msg.includes("secure context")
          ) {
            return "Liúlǎnqì yāoqiú zài ānquán liánxiàn (HTTPS) xià cái néng kāiqǐ màikèfēng.";
          }
          return "Wúfǎ kāiqǐ màikèfēng, qǐng quèrèn liúlǎnqì zhīyuán yǔyīn gōngnéng yǔ quánxiàn shèdìng.";
        }

        function getStatusMeta(currentStatus, muted) {
          switch (currentStatus) {
            case "connecting":
              return {
                statusLabel: "Liánxiàn zhōng",
                buttonLabel: "Liánxiàn zhōng",
                isActiveCall: true,
              };
            case "listening":
              return {
                statusLabel: muted ? "Màikèfēng yǐ jìngyīn" : "Língtīng zhōng",
                buttonLabel: "Jiéshù tōnghuà",
                isActiveCall: true,
              };
            case "speaking":
              return {
                statusLabel: "Hǎo péngyou shuōhuà zhōng",
                buttonLabel: "Jiéshù tōnghuà",
                isActiveCall: true,
              };
            case "error":
              return {
                statusLabel: "Liánxiàn zhōngduàn",
                buttonLabel: "Chóngxīn kāishǐ tōnghuà",
                isActiveCall: false,
              };
            case "idle":
            default:
              return {
                statusLabel: "",
                buttonLabel: "Kāishǐ tōnghuà",
                isActiveCall: false,
              };
          }
        }

        // UI Render Functions
        function setVisualEnergy(energy) {
          const clamped = Math.max(0, Math.min(1, energy));
          visualizerEl.style.setProperty("--voice-energy", clamped.toFixed(3));
        }

        function renderControls() {
          const meta = getStatusMeta(status, isMuted);
          const isConnecting = status === "connecting";
          const isListening = status === "listening";
          const isSpeaking = status === "speaking";
          const isLive = isListening || isSpeaking;

          visualizerEl.dataset.live = isLive ? "true" : "false";
          visualizerEl.dataset.mode = status;

          callToggleBtn.dataset.callStatus = status;
          callToggleBtn.setAttribute("aria-label", meta.buttonLabel);
          callBtnLabel.textContent = meta.buttonLabel;

          if (isConnecting) {
            callBtnIcon.innerHTML = ICONS.loaderLarge;
          } else if (isLive) {
            callBtnIcon.innerHTML = ICONS.phoneOffLarge;
          } else {
            callBtnIcon.innerHTML = ICONS.micLarge;
          }

          if (status === "idle") {
            statusIndicatorEl.classList.add("hidden");
            statusIndicatorEl.innerHTML = "";
            statusIndicatorEl.removeAttribute("aria-label");
          } else {
            statusIndicatorEl.classList.remove("hidden");
            statusIndicatorEl.setAttribute("aria-label", meta.statusLabel);

            if (isListening) {
              statusIndicatorEl.innerHTML = isMuted
                ? '<span class="status-badge-icon status-badge-muted">' +
                  ICONS.micOffSmall +
                  "</span>"
                : '<span class="status-badge-icon status-badge-listening">' +
                  ICONS.earSmall +
                  "</span>";
            } else {
              let iconHtml = "";
              if (isConnecting) iconHtml = ICONS.loaderSmall;
              else if (isSpeaking) iconHtml = ICONS.audioLinesSmall;
              else if (status === "error") iconHtml = ICONS.alertSmall;

              statusIndicatorEl.innerHTML = iconHtml;
              const textSpan = document.createElement("span");
              textSpan.textContent = meta.statusLabel;
              statusIndicatorEl.appendChild(textSpan);
            }
          }

          if (isLive) {
            activeControlsEl.classList.remove("hidden");
            const muteLabel = isMuted
              ? "Qǔxiāo jìngyīn"
              : "Màikèfēng jìngyīn";
            muteToggleBtn.setAttribute("aria-pressed", String(isMuted));
            muteToggleBtn.setAttribute("aria-label", muteLabel);
            muteToggleBtn.setAttribute("title", muteLabel);
            muteToggleBtn.innerHTML = isMuted ? ICONS.micOff : ICONS.mic;
            callTimerEl.textContent = formatCallDuration(durationSeconds);
          } else {
            activeControlsEl.classList.add("hidden");
          }

          if (errorMessage) {
            errorAlertEl.classList.remove("hidden");
            errorTextEl.textContent = errorMessage;
            subtitleCardEl.classList.add("hidden");
          } else {
            errorAlertEl.classList.add("hidden");
            if (transcripts.length > 0) {
              const latest = transcripts[transcripts.length - 1];
              subtitleCardEl.classList.remove("hidden");
              subtitleRoleEl.textContent =
                latest.role === "tutor" ? "Zhōngwén hǎo péngyou" : "Nǐ";
              subtitleTextEl.textContent = latest.text;
            } else {
              subtitleCardEl.classList.add("hidden");
            }
          }
        }

        function renderTranscripts() {
          const count = transcripts.length;
          transcriptBtnLabel.textContent =
            count > 0 ? "Duìhuà jìlù (" + count + ")" : "Duìhuà jìlù";
          openTranscriptsBtn.setAttribute(
            "aria-label",
            count > 0
              ? "Kāiqǐ duìhuà jìlù (" + count + ")"
              : "Kāiqǐ duìhuà jìlù"
          );

          if (count > 0) {
            drawerClearBtn.classList.remove("hidden");
          } else {
            drawerClearBtn.classList.add("hidden");
          }

          drawerBodyEl.innerHTML = "";
          if (count === 0) {
            const emptyDiv = document.createElement("div");
            emptyDiv.className = "drawer-empty";
            const p = document.createElement("p");
            p.textContent = "Mùqián hái méiyǒu duìhuà jìlù";
            emptyDiv.appendChild(p);
            drawerBodyEl.appendChild(emptyDiv);
          } else {
            for (const entry of transcripts) {
              const isTutor = entry.role === "tutor";
              const row = document.createElement("div");
              row.className =
                "msg-row " + (isTutor ? "msg-row-tutor" : "msg-row-student");

              const roleSpan = document.createElement("span");
              roleSpan.className = "msg-role";
              roleSpan.textContent = isTutor ? "Zhōngwén hǎo péngyou" : "Nǐ";

              const bubble = document.createElement("div");
              bubble.className =
                "msg-bubble " +
                (isTutor ? "msg-bubble-tutor" : "msg-bubble-student");
              bubble.textContent = entry.text;

              row.appendChild(roleSpan);
              row.appendChild(bubble);
              drawerBodyEl.appendChild(row);
            }
            if (isDrawerOpen) {
              drawerBodyEl.scrollTop = drawerBodyEl.scrollHeight;
            }
          }
        }

        function updateStatus(next) {
          status = next;
          if (next === "listening" || next === "speaking") {
            if (durationTimerId === null) {
              durationTimerId = window.setInterval(() => {
                durationSeconds += 1;
                callTimerEl.textContent = formatCallDuration(durationSeconds);
              }, 1000);
            }
          } else {
            if (durationTimerId !== null) {
              window.clearInterval(durationTimerId);
              durationTimerId = null;
            }
          }
          renderControls();
        }

        function upsertTranscript(role, text, isNewTurn) {
          const cleaned = (text || "").trim();
          if (!cleaned) return;

          const last = transcripts[transcripts.length - 1];
          if (last && last.role === role && !isNewTurn) {
            last.text = cleaned;
          } else {
            transcripts.push({
              id:
                Date.now() + "-" + Math.random().toString(36).slice(2, 7),
              role,
              text: cleaned,
            });
          }
          renderControls();
          renderTranscripts();
        }

        // Audio & Call Lifecycle
        function createAudioContextWithRate(preferredRate) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) {
            throw new Error("Liúlǎnqì bù zhīyuán Web Audio API.");
          }
          try {
            return new AudioCtx({ sampleRate: preferredRate });
          } catch {
            return new AudioCtx();
          }
        }

        function stopAllPlayback() {
          for (const src of activePlaybackSources) {
            try {
              src.onended = null;
              src.stop();
            } catch {
              // ignore
            }
          }
          activePlaybackSources.clear();
          nextStartTime = 0;
        }

        function teardownResources() {
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }

          stopAllPlayback();

          if (processorNode) {
            processorNode.onaudioprocess = null;
            try {
              processorNode.disconnect();
            } catch {
              // ignore
            }
            processorNode = null;
          }

          if (sourceNode) {
            try {
              sourceNode.disconnect();
            } catch {
              // ignore
            }
            sourceNode = null;
          }

          if (muteGainNode) {
            try {
              muteGainNode.disconnect();
            } catch {
              // ignore
            }
            muteGainNode = null;
          }

          analyserNode = null;

          if (micStream) {
            for (const track of micStream.getTracks()) {
              track.stop();
            }
            micStream = null;
          }

          if (ws) {
            const currentWs = ws;
            ws = null;
            currentWs.onopen = null;
            currentWs.onmessage = null;
            currentWs.onerror = null;
            currentWs.onclose = null;
            if (
              currentWs.readyState === WebSocket.OPEN ||
              currentWs.readyState === WebSocket.CONNECTING
            ) {
              currentWs.close();
            }
          }

          if (inputCtx) {
            const ctx = inputCtx;
            inputCtx = null;
            ctx.close().catch(() => {});
          }

          if (outputCtx) {
            const ctx = outputCtx;
            outputCtx = null;
            ctx.close().catch(() => {});
          }

          setVisualEnergy(0);
        }

        function schedulePlaybackChunk(base64Pcm) {
          if (!outputCtx) return;
          if (outputCtx.state === "suspended") {
            outputCtx.resume().catch(() => {});
          }

          const int16 = base64ToInt16Pcm(base64Pcm);
          if (int16.length === 0) return;

          const float32 = int16PcmToFloat32(int16);
          const audioBuffer = outputCtx.createBuffer(
            1,
            float32.length,
            MODEL_OUTPUT_SAMPLE_RATE
          );
          audioBuffer.getChannelData(0).set(float32);

          const source = outputCtx.createBufferSource();
          source.buffer = audioBuffer;

          if (analyserNode) {
            source.connect(analyserNode);
            analyserNode.connect(outputCtx.destination);
          } else {
            source.connect(outputCtx.destination);
          }

          const now = outputCtx.currentTime;
          if (nextStartTime < now) {
            nextStartTime = now + 0.04;
          }

          const startAt = nextStartTime;
          nextStartTime = startAt + audioBuffer.duration;

          activePlaybackSources.add(source);
          if (status !== "speaking") {
            updateStatus("speaking");
          }

          source.onended = () => {
            activePlaybackSources.delete(source);
            if (activePlaybackSources.size === 0 && status === "speaking") {
              updateStatus("listening");
            }
          };

          source.start(startAt);
        }

        function startVisualizerLoop() {
          const dataArray = new Uint8Array(64);
          const tick = () => {
            if (
              status === "speaking" &&
              analyserNode &&
              activePlaybackSources.size > 0
            ) {
              analyserNode.getByteTimeDomainData(dataArray);
              let sum = 0;
              for (let i = 0; i < dataArray.length; i++) {
                const normalized = (dataArray[i] - 128) / 128;
                sum += normalized * normalized;
              }
              const rms = Math.sqrt(sum / dataArray.length);
              setVisualEnergy(Math.min(1, rms * 3.5));
            } else if (status !== "listening") {
              setVisualEnergy(0);
            }
            rafId = requestAnimationFrame(tick);
          };
          rafId = requestAnimationFrame(tick);
        }

        function endCall() {
          teardownResources();
          isMuted = false;
          durationSeconds = 0;
          updateStatus("idle");
        }

        async function startCall() {
          if (status === "connecting") return;

          teardownResources();
          errorMessage = null;
          durationSeconds = 0;
          isMuted = false;
          updateStatus("connecting");

          // 1. Synchronously unlock Web Audio inside user gesture (critical for iOS Safari)
          try {
            inputCtx = createAudioContextWithRate(TARGET_INPUT_SAMPLE_RATE);
            outputCtx = createAudioContextWithRate(MODEL_OUTPUT_SAMPLE_RATE);

            inputCtx.resume().catch(() => {});
            outputCtx.resume().catch(() => {});

            const silent = outputCtx.createBuffer(
              1,
              1,
              MODEL_OUTPUT_SAMPLE_RATE
            );
            const silentSrc = outputCtx.createBufferSource();
            silentSrc.buffer = silent;
            silentSrc.connect(outputCtx.destination);
            silentSrc.start(0);

            analyserNode = outputCtx.createAnalyser();
            analyserNode.fftSize = 128;
          } catch (err) {
            teardownResources();
            errorMessage =
              err instanceof Error
                ? err.message
                : "Wúfǎ chūshǐhuà yīnxùn bōfàng.";
            updateStatus("error");
            return;
          }

          // 2. Request microphone permission
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            teardownResources();
            errorMessage =
              "Liúlǎnqì huánjìng bù zhīyuán màikèfēng, qǐng shǐyòng Safari huò Chrome (HTTPS).";
            updateStatus("error");
            return;
          }

          try {
            micStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                channelCount: 1,
              },
            });
          } catch (err) {
            teardownResources();
            errorMessage = mapMicrophoneError(err && err.name, err && err.message);
            updateStatus("error");
            return;
          }

          // 3. Connect WebSocket to server Gemini Live bridge
          const protocol =
            window.location.protocol === "https:" ? "wss:" : "ws:";
          const wsUrl = protocol + "//" + window.location.host + "/live";
          const socket = new WebSocket(wsUrl);
          ws = socket;

          let didStartMicPipeline = false;

          const startMicPipeline = () => {
            if (didStartMicPipeline || !inputCtx || !micStream) return;
            didStartMicPipeline = true;

            if (inputCtx.state === "suspended") {
              inputCtx.resume().catch(() => {});
            }

            sourceNode = inputCtx.createMediaStreamSource(micStream);
            processorNode = inputCtx.createScriptProcessor(4096, 1, 1);
            muteGainNode = inputCtx.createGain();
            muteGainNode.gain.value = 0;

            const actualRate =
              inputCtx.sampleRate || TARGET_INPUT_SAMPLE_RATE;

            processorNode.onaudioprocess = (event) => {
              if (!ws || ws.readyState !== WebSocket.OPEN) return;

              const inputData = event.inputBuffer.getChannelData(0);

              if (isMuted) {
                if (status === "listening") {
                  setVisualEnergy(0);
                }
                return;
              }

              if (status === "listening") {
                setVisualEnergy(calculateRmsLevel(inputData));
              }

              const downsampled = downsampleBuffer(
                inputData,
                actualRate,
                TARGET_INPUT_SAMPLE_RATE
              );
              const pcm16 = float32ToInt16Pcm(downsampled);
              const base64 = int16PcmToBase64(pcm16);

              ws.send(JSON.stringify({ type: "audio", data: base64 }));
            };

            sourceNode.connect(processorNode);
            processorNode.connect(muteGainNode);
            muteGainNode.connect(inputCtx.destination);

            startVisualizerLoop();
          };

          socket.onmessage = (event) => {
            let msg;
            try {
              msg = JSON.parse(event.data);
            } catch {
              return;
            }

            switch (msg.type) {
              case "connected":
                updateStatus("listening");
                startMicPipeline();
                break;
              case "audio":
                if (msg.data) {
                  schedulePlaybackChunk(msg.data);
                }
                break;
              case "outputTranscript":
                if (msg.text) {
                  upsertTranscript("tutor", msg.text, Boolean(msg.newTurn));
                }
                break;
              case "inputTranscript":
                if (msg.text) {
                  upsertTranscript("student", msg.text, Boolean(msg.newTurn));
                }
                break;
              case "interrupted":
                stopAllPlayback();
                if (status === "speaking") {
                  updateStatus("listening");
                }
                break;
              case "error":
                teardownResources();
                errorMessage =
                  msg.message ||
                  "Yǔyīn liánxiàn fāshēng cuòwù, qǐng shāohòu zài shì.";
                updateStatus("error");
                break;
              case "closed":
                if (status !== "idle" && status !== "error") {
                  teardownResources();
                  updateStatus("idle");
                }
                break;
            }
          };

          socket.onerror = () => {
            if (status === "idle" || status === "error") return;
            teardownResources();
            errorMessage =
              "Wúfǎ liánjiē yǔyīn sìfúqì, qǐng quèrèn wǎnglù hòu zài shì.";
            updateStatus("error");
          };

          socket.onclose = () => {
            if (status === "connecting") {
              teardownResources();
              errorMessage =
                "Yǔyīn sìfúqì liánxiàn shībài, qǐng shāohòu zài shì.";
              updateStatus("error");
            } else if (status === "listening" || status === "speaking") {
              teardownResources();
              updateStatus("idle");
            }
          };
        }

        // Drawer Controls
        function setDrawerOpen(open) {
          isDrawerOpen = open;
          if (open) {
            drawerRootEl.classList.remove("hidden");
            drawerBodyEl.scrollTop = drawerBodyEl.scrollHeight;
          } else {
            drawerRootEl.classList.add("hidden");
          }
        }

        // Event Listeners
        callToggleBtn.addEventListener("click", () => {
          if (
            status === "connecting" ||
            status === "listening" ||
            status === "speaking"
          ) {
            endCall();
          } else {
            startCall();
          }
        });

        muteToggleBtn.addEventListener("click", () => {
          isMuted = !isMuted;
          renderControls();
        });

        openTranscriptsBtn.addEventListener("click", () => setDrawerOpen(true));
        drawerBackdropEl.addEventListener("click", () => setDrawerOpen(false));
        drawerCloseBtn.addEventListener("click", () => setDrawerOpen(false));
        drawerClearBtn.addEventListener("click", () => {
          transcripts = [];
          renderControls();
          renderTranscripts();
        });

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && isDrawerOpen) {
            setDrawerOpen(false);
          }
        });

        window.addEventListener("beforeunload", () => {
          teardownResources();
        });

        // Initial render
        renderControls();
        renderTranscripts();
      })();
    </script>
  </body>
</html>
